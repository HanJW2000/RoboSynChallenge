# Diffusion Policy Evaluation Configuration
# python scripts/eval_policy.py --config policy/dp/deploy_policy.yml

# ------------------------------------------------------------------
# Basic experiment configuration (Each policy must be retained.)
# ------------------------------------------------------------------
policy_name: dp
task_name: null
setting: null
model_name: null
seed: 0
max_episodes: 20
max_steps: 1000
headless: false
pytorch_device: cuda
filter_dataset_saving: true
eval_video_log: true
eval_video_obs_keys:
  - cam_high
  - cam_right_wrist
  - cam_left_wrist
eval_reset_sync_steps: 1

# ------------------------------------------------------------------
# Diffusion Policy parameters used by get_model()
# ------------------------------------------------------------------
checkpoint_path: null
dp_num_inference_steps: 10
dp_step: 8
state_obs_path: robot/qpos
strict_action_dim: true
image_key_map:
  observation.images.cam_high: cam_high
  observation.images.cam_right_wrist: cam_right_wrist
  observation.images.cam_left_wrist: cam_left_wrist

# Optional explicit target localization. Disabled preserves legacy behavior.
target_locator_enabled: false
target_locator_model_path: null
target_locator_revision: null
target_locator_device: cuda
target_locator_prompt: "service bell. desk bell. call bell."
target_locator_box_threshold: 0.30
target_locator_text_threshold: 0.25
target_locator_max_area_fraction: 0.10
target_locator_min_teal_fraction: 0.0
target_locator_metrics_path: null
